<section class="wizard-step active">
  <div class="progress-bar-container">
    <div class="progress-bar-fill progress-fill-20"></div>
  </div>
  
  <h2 class="step-title">1. Empresa</h2>

  <div class="card-question">
    <div class="form-grid">
      
      <!-- Linha 1: CNPJ + Botão Consultar -->
      <div class="form-group">
        <label for="cnpj">CNPJ</label>
        <input type="text" class="form-control" id="cnpj" placeholder="00.000.000/0000-00">
      </div>
      
      <div class="form-group form-group-btn">
        <button type="button" class="btn-primary btn-consultar">Consultar</button>
      </div>

      <!-- Linha 2: Razão Social (Largura total) -->
      <div class="form-group full-width">
        <label for="razaoSocial">Razão Social</label>
        <input type="text" class="form-control" id="razaoSocial" placeholder="">
      </div>

      <!-- Linha 3: Nome Fantasia + Capital Social -->
      <div class="form-group">
        <label for="nomeFantasia">Nome Fantasia</label>
        <input type="text" class="form-control" id="nomeFantasia" placeholder="">
      </div>
      <div class="form-group">
        <label for="capitalSocial">Capital Social</label>
        <input type="text" class="form-control" id="capitalSocial" placeholder="">
      </div>

      <!-- Linha 4: CEP + Logradouro -->
      <div class="form-group">
        <label for="cep">CEP</label>
        <input type="text" class="form-control" id="cep" placeholder="00000-000">
      </div>
      <div class="form-group">
        <label for="logradouro">Logradouro</label>
        <input type="text" class="form-control" id="logradouro" placeholder="">
      </div>

      <!-- Linha 5: Número + Complemento -->
      <div class="form-group">
        <label for="numero">Número</label>
        <input type="text" class="form-control" id="numero" placeholder="">
      </div>
      <div class="form-group">
        <label for="complemento">Complemento</label>
        <input type="text" class="form-control" id="complemento" placeholder="">
      </div>

      <!-- Linha 6: Bairro + Município -->
      <div class="form-group">
        <label for="bairro">Bairro</label>
        <input type="text" class="form-control" id="bairro" placeholder="">
      </div>
      <div class="form-group">
        <label for="municipio">Município</label>
        <input type="text" class="form-control" id="municipio" placeholder="">
      </div>

      <!-- Linha 7: UF + Representante Legal -->
      <div class="form-group">
        <label for="uf">UF</label>
        <input type="text" class="form-control" id="uf" placeholder="">
      </div>
      <div class="form-group">
        <label for="representanteLegal">Representante Legal</label>
        <input type="text" class="form-control" id="representanteLegal" placeholder="">
      </div>

      <!-- Linha 8: CPF Representante + Cargo -->
      <div class="form-group">
        <label for="cpfRepresentante">CPF Representante</label>
        <input type="text" class="form-control" id="cpfRepresentante" placeholder="000.000.000-00">
      </div>
      <div class="form-group">
        <label for="cargo">Cargo</label>
        <input type="text" class="form-control" id="cargo" placeholder="">
      </div>

      <!-- Linha 9: E-mail + Telefone/WhatsApp -->
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" class="form-control" id="email" placeholder="exemplo@empresa.com.br">
      </div>
      <div class="form-group">
        <label for="telefoneWhatsapp">Telefone/WhatsApp</label>
        <input type="text" class="form-control" id="telefoneWhatsapp" placeholder="(00) 00000-0000">
      </div>

    </div>
  </div>

  <!-- Ações -->
  <div class="step-actions">
    <div></div>
    <button type="button" class="btn-primary btn-continuar" onclick="loadStep(2)">Continuar</button>
  </div>
</section>
