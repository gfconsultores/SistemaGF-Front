<section class="wizard-step active">
  <div class="progress-bar-container">
    <div class="progress-bar-fill progress-fill-85"></div>
  </div>
  <h2 class="step-title">5. Necessidade</h2>

  <div class="card-question">
    <!-- Usamos a classe exclusiva de necessidades -->
    <div class="necessidades-grid">
      
      <!-- Item 1 -->
      <div class="form-group">
        <label class="checkbox-option">
          <input type="checkbox" name="necessidade" value="regularizacao" class="custom-checkbox">
          <span>Regularização</span>
        </label>
      </div>

      <!-- Item 2 -->
      <div class="form-group">
        <label class="checkbox-option">
          <input type="checkbox" name="necessidade" value="anatel_fiscal" class="custom-checkbox">
          <span>Anatel + Fiscal</span>
        </label>
      </div>

      <!-- Item 3 -->
      <div class="form-group">
        <label class="checkbox-option">
          <input type="checkbox" name="necessidade" value="anatel" class="custom-checkbox">
          <span>Anatel</span>
        </label>
      </div>

      <!-- Item 4 -->
      <div class="form-group">
        <label class="checkbox-option">
          <input type="checkbox" name="necessidade" value="resp_tecnica" class="custom-checkbox">
          <span>Responsabilidade Técnica</span>
        </label>
      </div>

      <!-- Item 5 -->
      <div class="form-group">
        <label class="checkbox-option">
          <input type="checkbox" name="necessidade" value="fiscal" class="custom-checkbox">
          <span>Fiscal</span>
        </label>
      </div>

      <!-- Item 6 -->
      <div class="form-group">
        <label class="checkbox-option">
          <input type="checkbox" name="necessidade" value="gestao_completa" class="custom-checkbox">
          <span>Gestão completa</span>
        </label>
      </div>

    </div>
  </div>

  <!-- Ações da Etapa -->
  <div class="step-actions">
    <button type="button" class="btn-secondary" onclick="loadStep(4)">Voltar</button>
    <button type="button" class="btn-primary" onclick="loadStep(6)">Gerar diagnóstico</button>
  </div>
</section>
