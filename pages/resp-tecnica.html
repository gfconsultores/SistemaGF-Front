<section class="wizard-step active">
  <div class="progress-bar-container"><div class="progress-bar-fill" style="width: 50%;"></div></div>
  <h2 class="step-title">3. Responsabilidade Técnica</h2>

  <!-- Card 1: Seleção de Conselho -->
  <div class="card-question">
    <div class="form-grid">
      <div class="form-group full-width">
        <label for="conselho">Conselho</label>
        <select class="form-control" id="conselho">
          <option value="nao_sabe" selected>Não sabe informar</option>
          <option value="crt">CFT / CRT</option>
          <option value="crea">CREA</option>
          <option value="nenhum">Nenhum</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Card 2: Pergunta da Vigência / Regularidade -->
  <div class="card-question">
    <h3>A responsabilidade técnica está regular e vigente?</h3>
    <div class="pill-group">
      <button type="button" class="pill-btn" onclick="selectPill(this)">Sim</button>
      <button type="button" class="pill-btn" onclick="selectPill(this)">Não</button>
      <button type="button" class="pill-btn selected" onclick="selectPill(this)">Não sabe informar</button>
    </div>
  </div>

  <!-- Ações da Etapa -->
  <div class="step-actions">
    <button type="button" class="btn-secondary" onclick="loadStep(2)">Voltar</button>
    <button type="button" class="btn-primary" onclick="loadStep(4)">Continuar</button>
  </div>
</section>
